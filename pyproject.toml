[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*"]

[project]
name = "genai-data-assistant-monorepo"
version = "0.1.0"
description = "Monorepo root for GenAI Data Assistant"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "langchain>=0.1.14",
    "langchain-google-genai>=1.0.1",
    "langchain-community>=0.0.28",
    "google-generativeai>=0.5.0",
    "pypdf>=4.0.0",
    "docx2txt>=0.8",
    "langgraph>=0.0.30",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "qdrant-client>=1.8.0",
    "httpx>=0.27.0",
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
    ".git",
    "__pycache__",
    "data",
    "infra",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "E402", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["apps/api/tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:google.*",
    "ignore:.*langchain-community.*:DeprecationWarning",
    "ignore:.*langchain_community.*:DeprecationWarning",
    "ignore:.*HTTP_422_UNPROCESSABLE_ENTITY.*:UserWarning",
    "ignore:.*StarletteDeprecationWarning.*",
]
